name: 🏷️ Central Issue Triage Logic
on:
  workflow_call:
    inputs:
      project_number:
        description: "The GitHub Project V2 Number (e.g., '1')"
        required: true
        type: string
    secrets:
      PROJECT_ADMIN_TOKEN:
        description: "PAT with 'project' and 'repo' write access"
        required: true

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Unified Triage Automation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "--- 1. APPLYING REPO LABELS ---"
          LABELS=""
          if [[ "$BODY" == *"🔴 High"* ]]; then LABELS="$LABELS,priority: high"; fi
          if [[ "$BODY" == *"🟡 Medium"* ]]; then LABELS="$LABELS,priority: medium"; fi
          if [[ "$BODY" == *"🟢 Low"* ]]; then LABELS="$LABELS,priority: low"; fi
          
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then LABELS="$LABELS,area: backend"; fi
          if [[ "$BODY" == *"🎨 Frontend"* ]]; then LABELS="$LABELS,area: frontend"; fi
          if [[ "$BODY" == *"🔌 Integrations"* ]]; then LABELS="$LABELS,area: integrations"; fi
          if [[ "$BODY" == *"🤖 Automation"* ]]; then LABELS="$LABELS,area: automation"; fi
          if [[ "$BODY" == *"📝 Documentation"* ]]; then LABELS="$LABELS,area: documentation"; fi

          LABELS=${LABELS#,}
          if [ -n "$LABELS" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$OWNER/$REPO" --add-label "$LABELS" || true
          fi

          echo "--- 2. ACTIVE PROJECT INJECTION (PURE GRAPHQL) ---"
          if [ "$OWNER_TYPE" == "User" ]; then
            QUERY='query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) { id } } }'
            PROJECT_NODE_ID=$(gh api graphql -F owner="$OWNER" -F number=$PROJECT_NUMBER -f query="$QUERY" -q '.data.user.projectV2.id')
          else
            QUERY='query($owner: String!, $number: Int!) { organization(login: $owner) { projectV2(number: $number) { id } } }'
            PROJECT_NODE_ID=$(gh api graphql -F owner="$OWNER" -F number=$PROJECT_NUMBER -f query="$QUERY" -q '.data.organization.projectV2.id')
          fi

          if [ -z "$PROJECT_NODE_ID" ] || [ "$PROJECT_NODE_ID" == "null" ]; then
            echo "❌ Fatal: Could not resolve Project Node ID."
            exit 1
          fi

          MUTATION='mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } } }'
          ITEM_ID=$(gh api graphql -f projectId="$PROJECT_NODE_ID" -f contentId="$ISSUE_NODE_ID" -f query="$MUTATION" -q '.data.addProjectV2ItemById.item.id')

          echo "✅ Resolved ITEM_ID ($ITEM_ID) and PROJECT_NODE_ID ($PROJECT_NODE_ID)."

          echo "--- 3. FETCHING PROJECT SCHEMA IDS ---"
          if [ "$OWNER_TYPE" == "User" ]; then
            F_QUERY='query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) { fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'
          else
            F_QUERY='query($owner: String!, $number: Int!) { organization(login: $owner) { projectV2(number: $number) { fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'
          fi
          FIELDS_JSON=$(gh api graphql -F owner="$OWNER" -F number=$PROJECT_NUMBER -f query="$F_QUERY")
          PROJECT_FIELDS=$(echo "$FIELDS_JSON" | jq '.data.user.projectV2.fields.nodes // .data.organization.projectV2.fields.nodes')

          echo "--- 4. MAPPING AND UPDATING FIELDS ---"
          
          # Priority Mapping
          PRIORITY_KEY=""
          if [[ "$BODY" == *"🔴 High"* ]]; then PRIORITY_KEY="High"
          elif [[ "$BODY" == *"🟡 Medium"* ]]; then PRIORITY_KEY="Medium"
          elif [[ "$BODY" == *"🟢 Low"* ]]; then PRIORITY_KEY="Low"
          fi

          if [ -n "$PRIORITY_KEY" ]; then
            P_FIELD_ID=$(echo "$PROJECT_FIELDS" | jq -r --arg f "Priority" '.[]? | select(.name | contains($f)) | .id' | head -n 1)
            P_OPT_ID=$(echo "$PROJECT_FIELDS" | jq -r --arg f "Priority" --arg o "$PRIORITY_KEY" '.[]? | select(.name | contains($f)) | .options[]? | select(.name | contains($o)) | .id' | head -n 1)
            
            if [ -n "$P_FIELD_ID" ] && [ "$P_FIELD_ID" != "null" ] && [ -n "$P_OPT_ID" ] && [ "$P_OPT_ID" != "null" ]; then
              echo "Assigning Priority '$PRIORITY_KEY' (IDs found)"
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field-id "$P_FIELD_ID" --single-select-option-id "$P_OPT_ID"
            else
              echo "❌ Priority field/option mismatch. Schema dump required."
            fi
          fi

          # Area Mapping
          AREA_KEY=""
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then AREA_KEY="Backend"
          elif [[ "$BODY" == *"🎨 Frontend"* ]]; then AREA_KEY="Frontend"
          elif [[ "$BODY" == *"🔌 Integrations"* ]]; then AREA_KEY="Integrations"
          elif [[ "$BODY" == *"🤖 Automation"* ]]; then AREA_KEY="Automation"
          elif [[ "$BODY" == *"📝 Documentation"* ]]; then AREA_KEY="Documentation"
          fi

          if [ -n "$AREA_KEY" ]; then
            A_FIELD_ID=$(echo "$PROJECT_FIELDS" | jq -r --arg f "Area" '.[]? | select(.name | contains($f)) | .id' | head -n 1)
            A_OPT_ID=$(echo "$PROJECT_FIELDS" | jq -r --arg f "Area" --arg o "$AREA_KEY" '.[]? | select(.name | contains($f)) | .options[]? | select(.name | contains($o)) | .id' | head -n 1)
            
            if [ -n "$A_FIELD_ID" ] && [ "$A_FIELD_ID" != "null" ] && [ -n "$A_OPT_ID" ] && [ "$A_OPT_ID" != "null" ]; then
              echo "Assigning Area '$AREA_KEY' (IDs found)"
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field-id "$A_FIELD_ID" --single-select-option-id "$A_OPT_ID"
            else
              echo "❌ Area field/option mismatch. Schema dump required."
            fi
          fi
