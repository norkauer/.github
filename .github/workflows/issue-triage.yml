name: 🏷️ Central Issue Triage Logic
on:
  workflow_call:
    inputs:
      project_number:
        description: "The GitHub Project V2 Number (e.g., '1')"
        required: true
        type: string
    secrets:
      PROJECT_ADMIN_TOKEN:
        description: "PAT with 'project' and 'repo' write access"
        required: true

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Unified Triage Automation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "--- 1. APPLYING REPO LABELS ---"
          LABELS=""
          if [[ "$BODY" == *"🔴 High"* ]]; then LABELS="$LABELS,priority: high"; fi
          if [[ "$BODY" == *"🟡 Medium"* ]]; then LABELS="$LABELS,priority: medium"; fi
          if [[ "$BODY" == *"🟢 Low"* ]]; then LABELS="$LABELS,priority: low"; fi
          
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then LABELS="$LABELS,area: backend"; fi
          if [[ "$BODY" == *"🎨 Frontend"* ]]; then LABELS="$LABELS,area: frontend"; fi
          if [[ "$BODY" == *"🔌 Integrations"* ]]; then LABELS="$LABELS,area: integrations"; fi
          if [[ "$BODY" == *"🤖 Automation"* ]]; then LABELS="$LABELS,area: automation"; fi
          if [[ "$BODY" == *"📝 Documentation"* ]]; then LABELS="$LABELS,area: documentation"; fi

          # Remove leading comma if labels exist
          LABELS=${LABELS#,}

          if [ -n "$LABELS" ]; then
            echo "Adding labels: $LABELS"
            gh issue edit "$ISSUE_NUMBER" --repo "$OWNER/$REPO" --add-label "$LABELS" || echo "Warning: Could not add repo labels."
          else
            echo "No matching repo labels found in body."
          fi

          echo "--- 2. RESOLVING PROJECT V2 ITEM (POLLING) ---"
          # Polling loop ensures Graceful Degradation against GitHub backend delays
          MAX_RETRIES=6
          RETRY_COUNT=0
          PROJECT_DATA=""

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT+1)) to fetch GraphQL Project Data..."
            PROJECT_DATA=$(gh api graphql -F owner="$OWNER" -F name="$REPO" -F number=$ISSUE_NUMBER -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id, number }
                      }
                    }
                  }
                }
              }' -q ".data.repository.issue.projectItems.nodes[] | select(.project.number == $PROJECT_NUMBER)" || echo "")
            
            if [ -n "$PROJECT_DATA" ]; then
              echo "Success: Item found in project!"
              break
            fi
            
            echo "Not found yet. Native Auto-Add might still be running. Waiting 5s..."
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT+1))
          done

          if [ -z "$PROJECT_DATA" ]; then
            echo "Notice: Issue not linked to Project $PROJECT_NUMBER after 30 seconds."
            exit 0 # Exit cleanly to not fail the CI run
          fi

          ITEM_ID=$(echo "$PROJECT_DATA" | jq -r '.id')
          PROJECT_NODE_ID=$(echo "$PROJECT_DATA" | jq -r '.project.id')

          echo "--- 3. UPDATING PROJECT CUSTOM FIELDS ---"
          
          # Parse Priority
          PRIORITY=""
          if [[ "$BODY" == *"🔴 High"* ]]; then PRIORITY="🔴 High"
          elif [[ "$BODY" == *"🟡 Medium"* ]]; then PRIORITY="🟡 Medium"
          elif [[ "$BODY" == *"🟢 Low"* ]]; then PRIORITY="🟢 Low"
          fi

          if [ -n "$PRIORITY" ]; then
            echo "Setting Project Priority to $PRIORITY..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Priority" --single-select-option "$PRIORITY" || echo "Warning: Priority project field match failed."
          fi

          # Parse Project Area
          AREA=""
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then AREA="⚙️ Backend / Core Logic"
          elif [[ "$BODY" == *"🎨 Frontend"* ]]; then AREA="🎨 Frontend / UI / UX"
          elif [[ "$BODY" == *"🔌 Integrations"* ]]; then AREA="🔌 Integrations / APIs / Plugins"
          elif [[ "$BODY" == *"🤖 Automation"* ]]; then AREA="🤖 Automation / Scripts / Tooling"
          elif [[ "$BODY" == *"📝 Documentation"* ]]; then AREA="📝 Documentation / Concept"
          fi

          if [ -n "$AREA" ]; then
            echo "Setting Project Area to $AREA..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Project Area" --single-select-option "$AREA" || echo "Warning: Area project field match failed."
          fi
