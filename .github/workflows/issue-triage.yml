name: 🏷️ Central Issue Triage Logic
on:
  workflow_call:
    inputs:
      project_number:
        description: "The GitHub Project V2 Number (e.g., '1')"
        required: true
        type: string
    secrets:
      PROJECT_ADMIN_TOKEN:
        description: "PAT with 'project' and 'repo' write access"
        required: true

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Unified Triage Automation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "--- 1. APPLYING REPO LABELS ---"
          LABELS=""
          if [[ "$BODY" == *"🔴 High"* ]]; then LABELS="$LABELS,priority: high"; fi
          if [[ "$BODY" == *"🟡 Medium"* ]]; then LABELS="$LABELS,priority: medium"; fi
          if [[ "$BODY" == *"🟢 Low"* ]]; then LABELS="$LABELS,priority: low"; fi
          
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then LABELS="$LABELS,area: backend"; fi
          if [[ "$BODY" == *"🎨 Frontend"* ]]; then LABELS="$LABELS,area: frontend"; fi
          if [[ "$BODY" == *"🔌 Integrations"* ]]; then LABELS="$LABELS,area: integrations"; fi
          if [[ "$BODY" == *"🤖 Automation"* ]]; then LABELS="$LABELS,area: automation"; fi
          if [[ "$BODY" == *"📝 Documentation"* ]]; then LABELS="$LABELS,area: documentation"; fi

          LABELS=${LABELS#,}
          if [ -n "$LABELS" ]; then
            echo "Adding labels: $LABELS"
            gh issue edit "$ISSUE_NUMBER" --repo "$OWNER/$REPO" --add-label "$LABELS" || echo "Warning: Could not add repo labels."
          fi

          echo "--- 2. ACTIVE PROJECT INJECTION (PURE GRAPHQL) ---"
          echo "Resolving Project Node ID for $OWNER ($OWNER_TYPE)..."
          
          if [ "$OWNER_TYPE" == "User" ]; then
            QUERY='query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) { id } } }'
            PROJECT_NODE_ID=$(gh api graphql -F owner="$OWNER" -F number=$PROJECT_NUMBER -f query="$QUERY" -q '.data.user.projectV2.id')
          else
            QUERY='query($owner: String!, $number: Int!) { organization(login: $owner) { projectV2(number: $number) { id } } }'
            PROJECT_NODE_ID=$(gh api graphql -F owner="$OWNER" -F number=$PROJECT_NUMBER -f query="$QUERY" -q '.data.organization.projectV2.id')
          fi

          if [ -z "$PROJECT_NODE_ID" ] || [ "$PROJECT_NODE_ID" == "null" ]; then
            echo "❌ Fatal: Could not resolve Project Node ID. Check PROJECT_NUMBER."
            exit 1
          fi

          echo "Injecting Issue ($ISSUE_NODE_ID) into Project ($PROJECT_NODE_ID)..."
          MUTATION='mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } } }'
          ITEM_ID=$(gh api graphql -f projectId="$PROJECT_NODE_ID" -f contentId="$ISSUE_NODE_ID" -f query="$MUTATION" -q '.data.addProjectV2ItemById.item.id')

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" == "null" ]; then
            echo "❌ Fatal: Could not add issue to project."
            exit 1
          fi

          echo "✅ Successfully resolved ITEM_ID ($ITEM_ID) and PROJECT_NODE_ID ($PROJECT_NODE_ID)."

          echo "--- 3. UPDATING PROJECT CUSTOM FIELDS ---"
          
          echo "🔍 DUMPING PROJECT SCHEMA FOR DEBUGGING:"
          gh project field-list "$PROJECT_URL" || echo "Warning: Could not dump schema."

          # Parse Priority
          PRIORITY=""
          if [[ "$BODY" == *"🔴 High"* ]]; then PRIORITY="🔴 High"
          elif [[ "$BODY" == *"🟡 Medium"* ]]; then PRIORITY="🟡 Medium"
          elif [[ "$BODY" == *"🟢 Low"* ]]; then PRIORITY="🟢 Low"
          fi

          if [ -n "$PRIORITY" ]; then
            echo "Extracted Priority from Issue: '$PRIORITY'"
            echo "Attempting to assign..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Priority" --single-select-option "$PRIORITY" || \
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "🚨 Priority" --single-select-option "$PRIORITY" || \
            echo "❌ Failed to set Priority. Please check the Schema Dump above to see how your field and options are exactly named."
          else
            echo "No Priority found in issue body."
          fi

          # Parse Project Area
          AREA=""
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then AREA="⚙️ Backend / Core Logic"
          elif [[ "$BODY" == *"🎨 Frontend"* ]]; then AREA="🎨 Frontend / UI / UX"
          elif [[ "$BODY" == *"🔌 Integrations"* ]]; then AREA="🔌 Integrations / APIs / Plugins"
          elif [[ "$BODY" == *"🤖 Automation"* ]]; then AREA="🤖 Automation / Scripts / Tooling"
          elif [[ "$BODY" == *"📝 Documentation"* ]]; then AREA="📝 Documentation / Concept"
          fi

          if [ -n "$AREA" ]; then
            echo "Extracted Area from Issue: '$AREA'"
            echo "Attempting to assign..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Project Area" --single-select-option "$AREA" || \
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "📂 Project Area" --single-select-option "$AREA" || \
            echo "❌ Failed to set Area. Please check the Schema Dump above to see how your field and options are exactly named."
          else
            echo "No Area found in issue body."
          fi
