name: 🏷️ Issue Triage Automation
on:
  issues:
    types: [opened, edited]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Parse Issue and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            if (!body) return;

            const labelsToAdd = [];

            // Parse Priority Dropdown
            if (body.includes('🔴 High')) labelsToAdd.push('priority: high');
            if (body.includes('🟡 Medium')) labelsToAdd.push('priority: medium');
            if (body.includes('🟢 Low')) labelsToAdd.push('priority: low');

            // Parse Project Area Dropdown
            if (body.includes('⚙️ Backend')) labelsToAdd.push('area: backend');
            if (body.includes('🎨 Frontend')) labelsToAdd.push('area: frontend');
            if (body.includes('🔌 Integrations')) labelsToAdd.push('area: integrations');
            if (body.includes('🤖 Automation')) labelsToAdd.push('area: automation');
            if (body.includes('📝 Documentation')) labelsToAdd.push('area: documentation');

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAdd
              });
            }
