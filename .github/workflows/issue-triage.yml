name: 🏷️ Central Issue Triage Logic
on:
  workflow_call:
    inputs:
      project_number:
        description: "The GitHub Project V2 Number (e.g., '1')"
        required: true
        type: string
    secrets:
      PROJECT_ADMIN_TOKEN:
        description: "PAT with 'project' and 'repo' write access"
        required: true

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Unified Triage Automation
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "--- 1. APPLYING REPO LABELS ---"
          LABELS=""
          if [[ "$BODY" == *"🔴 High"* ]]; then LABELS="$LABELS,priority: high"; fi
          if [[ "$BODY" == *"🟡 Medium"* ]]; then LABELS="$LABELS,priority: medium"; fi
          if [[ "$BODY" == *"🟢 Low"* ]]; then LABELS="$LABELS,priority: low"; fi
          
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then LABELS="$LABELS,area: backend"; fi
          if [[ "$BODY" == *"🎨 Frontend"* ]]; then LABELS="$LABELS,area: frontend"; fi
          if [[ "$BODY" == *"🔌 Integrations"* ]]; then LABELS="$LABELS,area: integrations"; fi
          if [[ "$BODY" == *"🤖 Automation"* ]]; then LABELS="$LABELS,area: automation"; fi
          if [[ "$BODY" == *"📝 Documentation"* ]]; then LABELS="$LABELS,area: documentation"; fi

          LABELS=${LABELS#,}
          if [ -n "$LABELS" ]; then
            echo "Adding labels: $LABELS"
            gh issue edit "$ISSUE_NUMBER" --repo "$OWNER/$REPO" --add-label "$LABELS" || echo "Warning: Could not add repo labels."
          fi

          echo "--- 2. ACTIVE PROJECT INJECTION ---"
          # Dynamically build the exact URL to bypass the 'unknown owner type' CLI bug
          OWNER_TYPE="${{ github.event.repository.owner.type }}"
          if [ "$OWNER_TYPE" == "User" ]; then
            PROJECT_URL="https://github.com/users/$OWNER/projects/$PROJECT_NUMBER"
          else
            PROJECT_URL="https://github.com/orgs/$OWNER/projects/$PROJECT_NUMBER"
          fi
          
          ISSUE_URL="${{ github.event.issue.html_url }}"
          
          echo "Target Project: $PROJECT_URL"
          echo "Injecting Issue:  $ISSUE_URL"

          # 1. Fetch Project Node ID
          PROJECT_NODE_ID=$(gh project view "$PROJECT_URL" --format json --jq '.id' || echo "")
          if [ -z "$PROJECT_NODE_ID" ]; then
            echo "❌ Fatal: Could not resolve Project. Is the PROJECT_ADMIN_TOKEN valid and the PROJECT_NUMBER ($PROJECT_NUMBER) correct?"
            exit 1
          fi

          # 2. Force add the issue to the project (returns existing ID if already there)
          ITEM_ID=$(gh project item-add "$PROJECT_URL" --url "$ISSUE_URL" --format json --jq '.id' || echo "")
          if [ -z "$ITEM_ID" ]; then
            echo "❌ Fatal: Could not add issue to project."
            exit 1
          fi

          echo "✅ Successfully resolved ITEM_ID ($ITEM_ID) and PROJECT_NODE_ID ($PROJECT_NODE_ID)."

          echo "--- 3. UPDATING PROJECT CUSTOM FIELDS ---"
          
          # Parse Priority
          PRIORITY=""
          if [[ "$BODY" == *"🔴 High"* ]]; then PRIORITY="🔴 High"
          elif [[ "$BODY" == *"🟡 Medium"* ]]; then PRIORITY="🟡 Medium"
          elif [[ "$BODY" == *"🟢 Low"* ]]; then PRIORITY="🟢 Low"
          fi

          if [ -n "$PRIORITY" ]; then
            echo "Setting Project Priority to '$PRIORITY'..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Priority" --single-select-option "$PRIORITY" || echo "❌ Failed to set Priority. Ensure a field named 'Priority' with the exact option '$PRIORITY' exists in your Project Settings."
          fi

          # Parse Project Area
          AREA=""
          if [[ "$BODY" == *"⚙️ Backend"* ]]; then AREA="⚙️ Backend / Core Logic"
          elif [[ "$BODY" == *"🎨 Frontend"* ]]; then AREA="🎨 Frontend / UI / UX"
          elif [[ "$BODY" == *"🔌 Integrations"* ]]; then AREA="🔌 Integrations / APIs / Plugins"
          elif [[ "$BODY" == *"🤖 Automation"* ]]; then AREA="🤖 Automation / Scripts / Tooling"
          elif [[ "$BODY" == *"📝 Documentation"* ]]; then AREA="📝 Documentation / Concept"
          fi

          if [ -n "$AREA" ]; then
            echo "Setting Project Area to '$AREA'..."
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_NODE_ID" --field "Project Area" --single-select-option "$AREA" || echo "❌ Failed to set Area. Ensure a field named 'Project Area' with the exact option '$AREA' exists in your Project Settings."
          fi
